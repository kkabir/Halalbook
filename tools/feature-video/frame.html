<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Plus+Jakarta+Sans:wght@500;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 30%, #17694f 0%, #0b3d2e 55%, #04201a 100%); font-family: 'Plus Jakarta Sans', sans-serif; color: #fff; position: relative; }
  .pattern { position: absolute; inset: 0; background: url(../../src/HalalBook.Web/wwwroot/img/pattern.svg) 0 0 / 140px; opacity: .08; }
  .side { position: absolute; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .left { left: 70px; }
  .right { right: 70px; text-align: right; align-items: flex-end; }
  img { width: 150px; filter: drop-shadow(0 10px 30px rgba(0,0,0,.4)); }
  h1 { margin: 0; font-size: 92px; font-weight: 800; letter-spacing: -2px; background: linear-gradient(90deg, #f3dc8a, #d4af37 60%, #f3dc8a); -webkit-background-clip: text; color: transparent; }
  .ar { font-family: Amiri, serif; font-size: 46px; color: #f3dc8a; margin-top: -14px; }
  p { margin: 0; font-size: 32px; line-height: 1.35; color: #e6f2ec; max-width: 520px; }
  .pill { display: inline-block; padding: 14px 26px; border-radius: 999px; border: 2px solid #c9a227; color: #f3dc8a; font-weight: 800; font-size: 30px; }
  ul { list-style: none; margin: 0; padding: 0; font-size: 30px; line-height: 1.75; color: #e6f2ec; }
</style></head>
<body>
  <div class="pattern"></div>
  <div class="side left">
    <img src="../../src/HalalBook.Web/wwwroot/img/logo-mark.svg" alt="">
    <h1>HalalBook</h1>
    <div class="ar">بيت الأمة الرقمي</div>
    <p>A beautiful, safe social home for friends and family.</p>
    <div><span class="pill">halalbook.app</span></div>
  </div>
  <div class="side right">
    <ul>
      <li>Posts, polls &amp; reels 🎬</li>
      <li>Chats in your language 🌍</li>
      <li>Marketplace 🛍️</li>
      <li>Quran khatm &amp; Zakat 📖</li>
      <li>Calm, kind feed 🕊️</li>
      <li>19 languages ✨</li>
    </ul>
  </div>
</body></html>
